- name: Creating config tmp directory
  file:
    state: directory
    path: "/tmp/{{ container_name }}"

- name: Fetching config files
  fetch:
    src: "{{ deploy_dir }}/{{ container_name }}/{{ item}}"
    dest: "/tmp/{{ container_name }}/{{ item}}"
    flat: yes
  loop:
    - 'docker-compose.yml'

- name: Loading variable by docker-compose.yml file
  include_vars:
    file: "/tmp/{{ container_name }}/docker-compose.yml"
    name: docker_config

- name: Set variable
  set_fact:
    saved_query_scheduler:
      java_opts: "{{ docker_config['services']['{{ container_name }}']['environment']['JAVA_OPTS'] }}"
